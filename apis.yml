name: Studio Moderna
description: Studio Moderna is one of the largest multichannel direct-to-consumer
  retailers across Central and Eastern Europe, the Middle East, and beyond,
  founded in 1992 and headquartered in Emmen, Switzerland, with major operations
  based in Ljubljana, Slovenia. The company reaches consumers through TV
  direct-response (Top Shop), e-commerce, print catalogs, call centers, and
  physical retail stores in roughly twenty countries. Its portfolio of
  house brands spans sleep and home (Dormeo), kitchenware (Delimano), footwear
  and wellness (Walkmaxx), and health and lifestyle products (Kosmodisk, Rovus,
  WellNeo). It was surfaced as a portfolio company of Insight Partners and added
  to the API Evangelist network for enrichment; the company exposes no public
  developer or API surface at this time.
